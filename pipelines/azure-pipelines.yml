trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
- name: deployFunctionsDev
  displayName: 'Opt in to approved dev Flex code deployment (no sync/cutover)'
  type: boolean
  default: false
- name: deployFunctionsProd
  displayName: 'Opt in to approved prod Flex code deployment (requires same-run dev evidence)'
  type: boolean
  default: false
- name: functionsDevAppName
  type: string
  default: '__REQUIRED__'
- name: functionsProdAppName
  type: string
  default: '__REQUIRED__'
- name: functionsMigrationApprovers
  displayName: 'Named migration approvers (Azure DevOps users/groups)'
  type: string
  default: '__REQUIRED__'

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  apiProject: 'services/api/GamerUncle.Api.csproj'
  functionAppProject: 'services/functions/GamerUncle.Function.BggSync/GamerUncle.Function.BggSync.csproj'
  mobileProject: 'apps/mobile'
  publishOutputApiProject: '$(Build.ArtifactStagingDirectory)/publish/api'
  publishOutputFunctionProject: '$(Build.ArtifactStagingDirectory)/publish/function'
  publishOutputMobileProject: '$(Build.ArtifactStagingDirectory)/publish/mobile'

stages:
- stage: Validation
  displayName: 'PR Validation'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - job: ValidateProject
    displayName: 'Validate Project Structure'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'
    
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet
    
    - script: |
        echo "🔍 Validating project structure..."
        
        # Validate mobile project
        if [ -f "$(mobileProject)/package.json" ]; then
          echo "✅ Mobile package.json exists"
        else
          echo "❌ Mobile package.json missing"
          exit 1
        fi
        
        # Validate API project
        if [ -f "$(apiProject)" ]; then
          echo "✅ API project file exists"
        else
          echo "❌ API project file missing"
          exit 1
        fi
        
        # Validate solution file
        if [ -f "gamer-uncle.sln" ]; then
          echo "✅ Solution file exists"
        else
          echo "❌ Solution file missing"
          exit 1
        fi
        
        echo "✅ Project structure validation passed"
      displayName: 'Validate Project Files'

- stage: DevBuild
  displayName: 'Dev Build'
  dependsOn: 
  - Validation
  condition: |
    or(
      and(
        eq(variables['Build.Reason'], 'PullRequest'),
        in(dependencies.Validation.result, 'Succeeded', 'Skipped')
      ),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - job: BuildApiJob
    displayName: 'Build and Publish API Artifacts'
    dependsOn: BuildMobileJob
    condition: |
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'dropMobile'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: 'Download Mobile Artifacts'

    - task: ExtractFiles@1
      displayName: 'Extract Mobile Build'
      inputs:
        archiveFilePatterns: '$(System.ArtifactsDirectory)/dropMobile/mobile-web-build.zip'
        destinationFolder: '$(System.ArtifactsDirectory)/mobile-extracted'
        cleanDestinationFolder: true

    - script: dotnet restore $(apiProject)
      displayName: 'Restore API Dependencies'

    - script: dotnet build $(apiProject) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build API Project'

    - script: dotnet publish $(apiProject) --configuration $(buildConfiguration) --output $(publishOutputApiProject) --no-build
      displayName: 'Publish API Project'

    - script: |
        echo "Copying mobile web build to API wwwroot..."
        mkdir -p $(publishOutputApiProject)/wwwroot
        if [ -d "$(System.ArtifactsDirectory)/mobile-extracted" ] && [ "$(ls -A $(System.ArtifactsDirectory)/mobile-extracted 2>/dev/null)" ]; then
          cp -r $(System.ArtifactsDirectory)/mobile-extracted/* $(publishOutputApiProject)/wwwroot/
          echo "Mobile files copied to wwwroot:"
          ls -la $(publishOutputApiProject)/wwwroot/
          
          # Ensure web.config exists for SPA routing
          if [ -f "services/api/wwwroot/web.config" ]; then
            echo "Copying web.config for SPA routing..."
            cp services/api/wwwroot/web.config $(publishOutputApiProject)/wwwroot/
            echo "✅ web.config copied successfully"
          else
            echo "⚠️ No web.config found in services/api/wwwroot/"
          fi
        else
          echo "Warning: No mobile build found to copy"
        fi
      displayName: 'Copy Mobile Build to API wwwroot'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(publishOutputApiProject)'
        ArtifactName: 'dropApi'

  - job: BuildFunctionJob
    displayName: 'Build and Publish Function Artifacts'
    condition: |
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'filePath'
        filePath: 'pipelines/scripts/verify-functions-flex.Tests.ps1'
        pwsh: true
      displayName: 'Verify Fail-Closed Functions Deployment Checks (Mocked)'

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - script: dotnet restore $(functionAppProject)
      displayName: 'Restore Function Dependencies'

    - script: dotnet build $(functionAppProject) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Function App'

    - script: dotnet publish $(functionAppProject) --configuration $(buildConfiguration) --output $(publishOutputFunctionProject) --no-build
      displayName: 'Publish Function App'

    - script: dotnet restore services/tests/functions/GamerUncle.Functions.Tests.csproj
      displayName: 'Restore Functions Test Dependencies'

    - script: dotnet test services/tests/functions/GamerUncle.Functions.Tests.csproj --configuration $(buildConfiguration) --no-restore --logger trx --results-directory $(Agent.TempDirectory)/functions-tests
      displayName: 'Run Functions Regression Tests and Record Generated Metadata'
      env:
        FUNCTIONS_MANIFEST_PATH: '$(publishOutputFunctionProject)/functions.manifest.json'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/functions-tests/*.trx'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
      displayName: 'Publish Functions Test Results'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $root = $env:FUNCTIONS_PUBLISH_ROOT
        foreach ($file in @('host.json', 'worker.config.json', 'functions.manifest.json',
          'extensions.json', 'GamerUncle.Function.BggSync.dll', 'GamerUncle.Function.BggSync.runtimeconfig.json')) {
          if (-not (Test-Path -LiteralPath (Join-Path $root $file) -PathType Leaf)) {
            throw "Functions publish output is missing $file."
          }
        }
        $runtime = Get-Content (Join-Path $root 'GamerUncle.Function.BggSync.runtimeconfig.json') -Raw | ConvertFrom-Json
        $worker = Get-Content (Join-Path $root 'worker.config.json') -Raw | ConvertFrom-Json
        $names = @((Get-Content (Join-Path $root 'functions.manifest.json') -Raw | ConvertFrom-Json).name)
        if ($runtime.runtimeOptions.tfm -ne 'net10.0' -or
            $worker.description.language -ne 'dotnet-isolated' -or
            $worker.description.workerIndexing -ne 'true' -or
            (Test-Path -LiteralPath (Join-Path $root 'publish')) -or
            $names.Count -ne 13 -or @($names | Sort-Object -Unique).Count -ne 13 -or
            -not (Get-ChildItem (Join-Path $root '.azurefunctions') -Filter '*.dll' -File).Count) {
          throw 'Invalid net10 worker, generated function manifest, or host extensions.'
        }
      displayName: 'Validate Functions Publish Contract'
      env:
        FUNCTIONS_PUBLISH_ROOT: '$(publishOutputFunctionProject)'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(publishOutputFunctionProject)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/functions-artifact/function.zip'
        replaceExistingArchive: true
      displayName: 'Archive Exact Functions Artifact'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'functions-artifact/function.zip'
        $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
        try {
          $entries = @($zip.Entries.FullName)
          if ('host.json' -notin $entries -or 'functions.manifest.json' -notin $entries -or
              @($entries | Where-Object { $_ -like 'publish/*' }).Count -or
              -not @($entries | Where-Object { $_ -like '.azurefunctions/*.dll' }).Count) {
            throw 'Functions ZIP root or hidden extension content is invalid.'
          }
        }
        finally {
          $zip.Dispose()
        }
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        Set-Content -LiteralPath "$archive.sha256" -Value $hash -NoNewline
        Write-Host "Functions artifact SHA256: $hash"
        Write-Host "##vso[task.setvariable variable=functionArtifactSha256;isOutput=true]$hash"
      name: RecordFunctionArtifact
      displayName: 'Record Functions Artifact SHA256'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/functions-artifact'
        ArtifactName: 'dropFunction'

  - job: BuildMobileJob
    displayName: 'Build and Publish Mobile Artifacts'
    condition: |
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        echo "Installing Expo CLI globally..."
        npm install -g @expo/cli@latest
        echo "Expo CLI version:"
        npx expo --version
        echo "Node.js version:"
        node --version
        echo "npm version:"
        npm --version
      displayName: 'Setup Expo CLI'

    - script: |
        cd $(mobileProject)
        echo "Installing mobile dependencies..."
        
        # Set npm configuration for CI optimization
        npm config set audit false
        npm config set fund false
        npm config set prefer-offline true
        
        # Check if package-lock.json is in sync with package.json
        echo "🔍 Checking package-lock.json sync status..."
        if npm ci --dry-run 2>/dev/null; then
          echo "✅ package-lock.json is in sync, using npm ci"
          npm ci --prefer-offline --no-audit --ignore-scripts --silent
        else
          echo "⚠️ package-lock.json out of sync, updating and using npm install"
          npm install --prefer-offline --no-audit --ignore-scripts --silent
          
          # Generate updated lock file for future runs
          echo "📝 Updated package-lock.json generated"
        fi
        
        # Verify critical dependencies are installed
        echo "🔍 Verifying critical dependencies..."
        if [ ! -d "node_modules/@expo/cli" ] && [ ! -d "node_modules/.bin/expo" ]; then
          echo "❌ Expo CLI not found in dependencies, installing globally as fallback"
          npm install -g @expo/cli@latest --silent
        fi
        
        # Verify webpack is available (required for builds)
        if [ ! -d "node_modules/webpack" ]; then
          echo "❌ Webpack not found, this may cause build issues"
          exit 1
        fi
        
        echo "✅ Dependencies installed successfully"
        echo "📊 Node modules size:"
        du -sh node_modules 2>/dev/null || echo "Could not determine size"
        
        # Verify key binaries are available
        echo "🔍 Verifying build tools..."
        which node && echo "✅ Node.js available"
        which npm && echo "✅ npm available"
        npx expo --version && echo "✅ Expo CLI available" || echo "⚠️ Expo CLI check failed"
      displayName: 'Install Mobile Dependencies'
      timeoutInMinutes: 10

    - script: |
        cd $(mobileProject)
        echo "Validating project structure..."
        echo "Current directory: $(pwd)"
        echo "Project files:"
        ls -la
        echo "Checking essential files..."
        [ -f "package.json" ] && echo "✓ package.json exists" || (echo "✗ package.json missing" && exit 1)
        [ -f "app.json" ] && echo "✓ app.json exists" || (echo "✗ app.json missing" && exit 1)
        [ -f "App.tsx" ] && echo "✓ App.tsx exists" || (echo "✗ App.tsx missing" && exit 1)
        [ -d "node_modules" ] && echo "✓ node_modules exists" || (echo "✗ node_modules missing" && exit 1)
        echo "Project structure validation passed"
      displayName: 'Validate Mobile Project Structure'

    - script: |
        cd $(mobileProject)
        echo "🚀 Starting Expo web export..."
        echo "📁 Output directory: $(publishOutputMobileProject)"
        
        # Check Expo CLI version and validate environment
        echo "🔍 Checking build environment..."
        echo "Expo CLI version:"
        npx expo --version || exit 1
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        
        # Validate project before build
        echo "🔍 Validating project files..."
        if [ ! -f "app.json" ] || [ ! -f "App.tsx" ]; then
          echo "❌ Essential project files missing"
          exit 1
        fi
        
        # Clean any previous build artifacts
        echo "🧹 Cleaning previous build artifacts..."
        rm -rf dist/ .expo/ node_modules/.cache/ || true
        
        # Set environment variables for production build
        export NODE_ENV=production
        export CI=true
        export EXPO_NO_TELEMETRY=1
        
        # Build using npm script with enhanced error handling
        echo "🔨 Building web app for production..."
        BUILD_SUCCESS=false
        
        if timeout 900 npm run build:web; then
          echo "✅ npm build:web succeeded"
          BUILD_SUCCESS=true
          
          # Check if files are in default dist location
          if [ -d "dist" ] && [ ! -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "📦 Moving files from dist/ to output directory..."
            mkdir -p $(publishOutputMobileProject)
            cp -r dist/* $(publishOutputMobileProject)/
            echo "✅ Files moved to $(publishOutputMobileProject)"
          else
            echo "❌ No dist directory found after build"
            BUILD_SUCCESS=false
          fi
        else
          echo "⚠️ npm build:web failed or timed out, trying direct expo export..."
        fi
        
        # Fallback to direct expo export if npm script failed
        if [ "$BUILD_SUCCESS" = false ]; then
          echo "🔄 Attempting fallback build with expo export..."
          if timeout 900 npx expo export --platform web --output-dir $(publishOutputMobileProject) --clear; then
            echo "✅ Direct expo export succeeded"
            BUILD_SUCCESS=true
          else
            echo "❌ All build methods failed"
            echo "🔍 Checking for any partial build outputs..."
            ls -la $(publishOutputMobileProject) 2>/dev/null || echo "No output directory found"
            ls -la dist/ 2>/dev/null || echo "No dist directory found"
            exit 1
          fi
        fi
        
        # Verify we have content and validate build quality
        echo "🔍 Verifying build artifacts..."
        if [ -d "$(publishOutputMobileProject)" ] && [ "$(ls -A $(publishOutputMobileProject) 2>/dev/null)" ]; then
          echo "✅ Build artifacts created successfully"
          echo "📊 Build contents:"
          ls -la $(publishOutputMobileProject)
          
          # Check for essential web files
          if [ -f "$(publishOutputMobileProject)/index.html" ]; then
            echo "✅ index.html found"
          else
            echo "⚠️ index.html not found - this may cause deployment issues"
          fi
          
          # Check total size
          BUILD_SIZE=$(du -sh $(publishOutputMobileProject) | cut -f1)
          echo "📏 Total build size: $BUILD_SIZE"
        else
          echo "❌ No build artifacts found"
          exit 1
        fi
      displayName: 'Build and Export Mobile Web Bundle'
      timeoutInMinutes: 20

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(publishOutputMobileProject)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/mobile-web-build.zip'
        replaceExistingArchive: true
      displayName: 'Archive Mobile Build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/mobile-web-build.zip'
        ArtifactName: 'dropMobile'
      displayName: 'Publish Mobile Artifacts'

- stage: DevDeployApi
  displayName: 'Dev Deploy Api'
  dependsOn: 
    - DevBuild
    - DevTest
  # Updated condition to be more reliable for post-merge deployments
  condition: |
    and(
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Web App'
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Scale Up Dev App Service to B1'
            inputs:
              azureSubscription: 'gamer-uncle-dev-sc'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                CURRENT_SKU=$(az appservice plan show \
                  --name gamer-uncle-dev-app-plan \
                  --resource-group gamer-uncle-dev-rg \
                  --query "sku.name" --output tsv)
                echo "Current dev App Service Plan SKU: $CURRENT_SKU"
                if [ "$CURRENT_SKU" != "B1" ]; then
                  echo "Scaling up to B1 for deployment..."
                  az appservice plan update \
                    --name gamer-uncle-dev-app-plan \
                    --resource-group gamer-uncle-dev-rg \
                    --sku B1
                  echo "Scaled to B1. Waiting 30s for plan to stabilize..."
                  sleep 30
                else
                  echo "Already on B1 — no scale-up needed."
                fi

          - download: current
            artifact: dropApi

          - task: AzureCLI@2
            displayName: 'Configure API App Settings'
            inputs:
              azureSubscription: 'gamer-uncle-dev-sc'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp config appsettings set \
                  --name gamer-uncle-dev-app-svc \
                  --resource-group gamer-uncle-dev-rg \
                  --settings \
                    'CosmosDb__Endpoint=https://gamer-uncle-dev-cosmos.documents.azure.com:443/' \
                    'CosmosDb__TenantId=c88223a3-60b3-4697-9374-209fc154bdf1'

          - task: AzureWebApp@1
            displayName: 'Deploy Web App'
            inputs:
              azureSubscription: 'gamer-uncle-dev-sc'
              appType: 'webApp'
              appName: 'gamer-uncle-dev-app-svc'
              package: '$(Pipeline.Workspace)/dropApi'


- stage: DevDeployFunctions
  displayName: 'Approved Dev Flex Code Deployment'
  dependsOn: 
    - DevBuild
    - DevTest
  condition: |
    and(
      succeeded(),
      ${{ eq(parameters.deployFunctionsDev, true) }},
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(dependencies.DevBuild.result, 'Succeeded'),
      eq(dependencies.DevTest.result, 'Succeeded')
    )
  variables:
    functionArtifactSha256: $[ stageDependencies.DevBuild.BuildFunctionJob.outputs['RecordFunctionArtifact.functionArtifactSha256'] ]

  jobs:
  - job: ApproveDevFunctionsCode
    pool: server
    timeoutInMinutes: 1445
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: '${{ parameters.functionsMigrationApprovers }}'
        approvers: '${{ parameters.functionsMigrationApprovers }}'
        allowApproversToApproveTheirOwnRuns: false
        onTimeout: 'reject'
        instructions: |
          Approve code deployment only to ${{ parameters.functionsDevAppName }}.
          Current run: $(Build.BuildId); SHA256: $(functionArtifactSha256).
          Reject unless the spec's provisioning, cost, identity, isolation, recovery, and owner decisions are recorded.
          All five starters must already be disabled. This does not authorize a sync, Azure access change, or cutover.
  - deployment: DeployFunctionApp
    dependsOn: ApproveDevFunctionsCode
    displayName: 'Deploy Disabled Dev Flex App'
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/deploy-functions-flex.yml
            parameters:
              appName: '${{ parameters.functionsDevAppName }}'
              sourceAppName: 'gamer-uncle-dev-function'
              resourceGroup: 'gamer-uncle-dev-rg'
              serviceConnection: 'gamer-uncle-dev-sc'
              environment: 'Development'
              approvers: '${{ parameters.functionsMigrationApprovers }}'

- stage: DevDeployMobile
  displayName: 'Dev Deploy Mobile'
  dependsOn: 
    - DevBuild
    - DevTest
  # Updated condition to be more reliable for post-merge deployments
  condition: |
    and(
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - deployment: DeployMobileApp
    displayName: 'Deploy Mobile Web App'
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: dropMobile

          - task: ExtractFiles@1
            displayName: 'Extract Mobile Build'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/dropMobile/mobile-web-build.zip'
              destinationFolder: '$(Pipeline.Workspace)/mobile-extracted'
              cleanDestinationFolder: true

          # This step could be used to deploy to Azure Static Web Apps or similar
          - script: |
              echo "Mobile web build extracted to: $(Pipeline.Workspace)/mobile-extracted"
              echo "Contents:"
              ls -la $(Pipeline.Workspace)/mobile-extracted/
              echo "Mobile web app is ready for deployment to hosting service"
            displayName: 'Verify Mobile Build Extraction'

          # Add actual deployment steps here when you have a hosting target
          # Example for Azure Static Web Apps:
          # - task: AzureStaticWebApp@0
          #   inputs:
          #     app_location: '$(Pipeline.Workspace)/mobile-extracted'
          #     api_location: ''
          #     output_location: ''
          #     azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)

- stage: DevTest
  displayName: 'Dev Test'
  dependsOn: DevBuild
  # Add stage-level condition to ensure it runs for both PR and main branch
  condition: |
    or(
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - job: TestApiJob
    displayName: 'Run API Tests'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - script: dotnet restore services/tests/api/GamerUncle.Api.Tests.csproj
      displayName: 'Restore API Test Dependencies'

    - script: dotnet test services/tests/api/GamerUncle.Api.Tests.csproj --configuration $(buildConfiguration) --logger trx --results-directory $(Agent.TempDirectory)
      displayName: 'Run API Unit Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/*.trx'
        failTaskOnFailedTests: true
      displayName: 'Publish API Test Results'

  - job: TestPipelineJob
    displayName: 'Run Pipeline Tests'
    condition: |
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - script: dotnet restore pipelines/tests/GamerUncle.Pipeline.Tests.csproj
      displayName: 'Restore Pipeline Test Dependencies'

    - script: dotnet test pipelines/tests/GamerUncle.Pipeline.Tests.csproj --configuration $(buildConfiguration) --logger trx --results-directory $(Agent.TempDirectory)
      displayName: 'Run Pipeline Validation Tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/*.trx'
        failTaskOnFailedTests: true
      displayName: 'Publish Pipeline Test Results'

  - job: TestMobileJob
    displayName: 'Run Mobile Tests'
    condition: |
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        cd $(mobileProject)
        # Ensure dependencies are installed for unit tests
        echo "Installing mobile dependencies for unit tests..."
        
        # Check if package-lock.json is in sync with package.json
        if npm ci --dry-run 2>/dev/null; then
          echo "✅ package-lock.json is in sync, using npm ci"
          npm ci --prefer-offline --no-audit --ignore-scripts
        else
          echo "⚠️ package-lock.json out of sync, using npm install"
          npm install --prefer-offline --no-audit --ignore-scripts
        fi
      displayName: 'Install Mobile Dependencies'

    - script: |
        cd $(mobileProject)
        echo "Running mobile unit tests..."
        
        # Run tests with CI optimizations
        export CI=true
        export NODE_ENV=test
        
        # Run tests - fail the build if tests fail
        npm test -- --watchAll=false --coverage=false
      displayName: 'Run Mobile Tests'

- stage: FunctionalTestsPR
  displayName: 'PR Functional Tests'
  dependsOn: DevBuild
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - job: RunLocalFunctionalTests
    displayName: 'Start API and Run Functional Tests'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    - script: dotnet restore $(apiProject)
      displayName: 'Restore API Dependencies'

    - script: dotnet build $(apiProject) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build API Project'

    - script: dotnet restore services/tests/functional/GamerUncle.Api.FunctionalTests.csproj
      displayName: 'Restore Functional Test Dependencies'

    - script: dotnet build services/tests/functional/GamerUncle.Api.FunctionalTests.csproj --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Functional Tests'

    - script: |
        echo "🧪 Running functional tests with in-process server (WebApplicationFactory)..."
        echo "Environment: Testing (auth disabled, rate limiting disabled)"
        
        export ASPNETCORE_ENVIRONMENT=Testing
        export AGENT_USE_FAKE=true
        export SKIP_VOICE_TESTS=true
        
        # Unset API_BASE_URL to ensure WebApplicationFactory in-process path is used
        unset API_BASE_URL
        unset TEST_ENVIRONMENT
        
        # Run the tests with retry logic (1 retry)
        TEST_RESULT=0
        MAX_RETRIES=2
        RETRY_COUNT=0
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "🧪 Functional test attempt $RETRY_COUNT of $MAX_RETRIES..."
          
          if dotnet test services/tests/functional/GamerUncle.Api.FunctionalTests.csproj --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory); then
            echo "✅ Functional tests passed on attempt $RETRY_COUNT"
            TEST_RESULT=0
            break
          else
            TEST_RESULT=$?
            echo "❌ Functional tests failed on attempt $RETRY_COUNT (exit code: $TEST_RESULT)"
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "🧹 Cleaning failed test results before retry..."
              rm -f $(Agent.TempDirectory)/*.trx 2>/dev/null || true
              echo "⏳ Waiting 10 seconds before retry..."
              sleep 10
            else
              echo "❌ All functional test attempts failed after $MAX_RETRIES tries"
            fi
          fi
        done
        
        exit $TEST_RESULT
      displayName: 'Run Functional Tests (In-Process)'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/*.trx'
        failTaskOnFailedTests: true
      displayName: 'Publish Functional Test Results'
      condition: always()

