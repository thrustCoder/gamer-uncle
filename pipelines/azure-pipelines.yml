- stage: DevDeployAlerts
  displayName: 'Dev Deploy Alerts'
  dependsOn:
    - DevBuild
    - DevTest
  condition: |
    and(
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - job: DeployDevAlerts
    displayName: 'Deploy Alert Rules to Dev'
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'Deploy Alert Bicep to Dev'
      inputs:
        azureSubscription: 'gamer-uncle-dev-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Deploying alert rules to dev..."
          az deployment group create \
            --resource-group gamer-uncle-dev-rg \
            --template-file infrastructure/alerts/main.bicep \
            --parameters \
              environment=dev \
              appServiceId=$(az webapp show --name gamer-uncle-dev-app-svc --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              appServicePlanId=$(az appservice plan show --name gamer-uncle-dev-app-plan --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              cosmosDbAccountId=$(az cosmosdb show --name gamer-uncle-dev-cosmos --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              functionAppId=$(az functionapp show --name gamer-uncle-dev-function --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              appInsightsId=$(az monitor app-insights component show --app gamer-uncle-dev-app-insights --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              aiServicesAccountId=$(az cognitiveservices account show --name gamer-uncle-dev-foundry --resource-group gamer-uncle-dev-rg --query id -o tsv) \
              logAnalyticsWorkspaceId=$(az monitor log-analytics workspace show --workspace-name gamer-uncle-dev-log-analytics-ws --resource-group gamer-uncle-dev-rg --query id -o tsv) \
            --name "alerts-deploy-dev-$(Build.BuildId)"
          echo "Dev alert deployment complete."
    - task: AzureCLI@2
      displayName: 'Verify Dev Alerts'
      inputs:
        azureSubscription: 'gamer-uncle-dev-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
                METRIC_COUNT=$(az monitor metrics alert list --resource-group gamer-uncle-dev-rg --query "length([])" -o tsv)
                LOG_COUNT=$(az monitor scheduled-query list --resource-group gamer-uncle-dev-rg --query "length([])" -o tsv)
                echo "Dev alerts: $METRIC_COUNT metric + $LOG_COUNT log = $((METRIC_COUNT + LOG_COUNT)) total"
                if [ "$((METRIC_COUNT + LOG_COUNT))" -lt 20 ]; then
                  echo "WARNING: Expected 24+ alerts, found $((METRIC_COUNT + LOG_COUNT))"
                fi

- stage: ProdDeployApi
  displayName: 'Prod Deploy Api'
  dependsOn: 
    - FunctionalTestsDev
  # Only deploy to prod after successful dev functional tests
  condition: |
    and(
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      in(dependencies.FunctionalTestsDev.result, 'Succeeded')
    )

  jobs:
  - job: DeployProdWebApp
    displayName: 'Deploy Prod Web App'
    steps:
    - download: current
      artifact: dropApi

    - task: AzureCLI@2
      displayName: 'Enable Deployment Alert Suppression'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Enabling deployment suppression rule to prevent cold-start latency alerts..."
          RULE_ID=$(az monitor alert-processing-rule show \
            --name gamer-uncle-prod-deploy-suppression \
            --resource-group gamer-uncle-prod-rg \
            --query id -o tsv 2>/dev/null || echo "")
          if [ -n "$RULE_ID" ]; then
            az monitor alert-processing-rule update \
              --name gamer-uncle-prod-deploy-suppression \
              --resource-group gamer-uncle-prod-rg \
              --enabled true \
              --output none
            echo "✅ Deployment suppression rule enabled"
          else
            echo "⚠️ Deployment suppression rule not found — skipping (alerts may fire during cold start)"
          fi

    - task: AzureCLI@2
      displayName: 'Configure Prod API App Settings'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az webapp config appsettings set \
            --name gamer-uncle-prod-app-svc \
            --resource-group gamer-uncle-prod-rg \
            --settings \
              'CosmosDb__Endpoint=https://gamer-uncle-prod-cosmos.documents.azure.com:443/' \
              'CosmosDb__TenantId=c88223a3-60b3-4697-9374-209fc154bdf1' \
              'ASPNETCORE_ENVIRONMENT=Production' \
              'Swagger__Enabled=true'

    - task: AzureWebApp@1
      displayName: 'Deploy Prod Web App'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        appType: 'webApp'
        appName: 'gamer-uncle-prod-app-svc'
        package: '$(Pipeline.Workspace)/dropApi'

    - task: AzureCLI@2
      displayName: 'Configure Prod Autoscaling'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Configuring autoscaling for production App Service Plan..."
          
          PLAN_ID=$(az appservice plan show \
            --name gamer-uncle-prod-app-plan \
            --resource-group gamer-uncle-prod-rg \
            --query "id" -o tsv 2>/dev/null)
          
          if [ -z "$PLAN_ID" ]; then
            echo "❌ Could not find App Service Plan"
            exit 1
          fi
          
          PLAN_SKU=$(az appservice plan show \
            --name gamer-uncle-prod-app-plan \
            --resource-group gamer-uncle-prod-rg \
            --query "sku.tier" -o tsv 2>/dev/null)
          
          case "$PLAN_SKU" in
            Free|Shared|Basic)
              echo "⚠️ Plan tier '$PLAN_SKU' does not support autoscaling. Skipping."
              exit 0
              ;;
          esac
          
          echo "Plan tier: $PLAN_SKU — autoscaling supported"
          
          # Check if autoscale setting already exists
          EXISTING=$(az monitor autoscale show \
            --name gamer-uncle-prod-autoscale \
            --resource-group gamer-uncle-prod-rg \
            -o tsv 2>/dev/null || echo "")
          
          if [ -n "$EXISTING" ]; then
            echo "✅ Autoscale setting already exists, skipping update to preserve current min/default settings."
          else
            echo "Creating autoscale setting (min=1, max=4, default=1)..."
            az monitor autoscale create \
              --name gamer-uncle-prod-autoscale \
              --resource-group gamer-uncle-prod-rg \
              --resource "$PLAN_ID" \
              --min-count 1 \
              --max-count 4 \
              --count 1 \
              --output none
            
            echo "Adding scale-out rule (CPU > 70% avg 5m -> +1 instance)..."
            az monitor autoscale rule create \
              --autoscale-name gamer-uncle-prod-autoscale \
              --resource-group gamer-uncle-prod-rg \
              --condition "CpuPercentage > 70 avg 5m" \
              --scale out 1 \
              --cooldown 5 \
              --output none
            
            echo "Adding scale-in rule (CPU < 30% avg 10m -> -1 instance)..."
            az monitor autoscale rule create \
              --autoscale-name gamer-uncle-prod-autoscale \
              --resource-group gamer-uncle-prod-rg \
              --condition "CpuPercentage < 30 avg 10m" \
              --scale in 1 \
              --cooldown 5 \
              --output none
          fi
          
          # Verify
          RULE_COUNT=$(az monitor autoscale show \
            --name gamer-uncle-prod-autoscale \
            --resource-group gamer-uncle-prod-rg \
            --query "length(profiles[0].rules)" -o tsv 2>/dev/null)
          
          echo "✅ Autoscale configured: min=1, max=4, rules=$RULE_COUNT"

- stage: FunctionsValidationDev
  displayName: 'Review Functions-Specific Dev Evidence'
  dependsOn:
    - DevBuild
    - DevDeployFunctions
    - FunctionalTestsDev
  condition: |
    and(
      succeeded(),
      ${{ eq(parameters.deployFunctionsDev, true) }},
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(dependencies.DevBuild.result, 'Succeeded'),
      eq(dependencies.DevDeployFunctions.result, 'Succeeded'),
      eq(dependencies.FunctionalTestsDev.result, 'Succeeded')
    )
  variables:
    functionArtifactSha256: $[ stageDependencies.DevBuild.BuildFunctionJob.outputs['RecordFunctionArtifact.functionArtifactSha256'] ]
  jobs:
  - job: ReviewFunctionsDevEvidence
    pool: server
    timeoutInMinutes: 1445
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: '${{ parameters.functionsMigrationApprovers }}'
        approvers: '${{ parameters.functionsMigrationApprovers }}'
        allowApproversToApproveTheirOwnRuns: false
        onTimeout: 'reject'
        instructions: |
          Review secure dev evidence for run $(Build.BuildId), app ${{ parameters.functionsDevAppName }},
          SHA256 $(functionArtifactSha256). Record the evidence location and named review decision.
          Reject missing, stale, skip-only, or different-artifact evidence. Host readiness is insufficient.
          Require actual bounded BGG fetch/Cosmos write/readback and telemetry; ranked/timer, continuation,
          restart/failure and payload compatibility exercises; unchanged API results and document readback;
          source drain/duplicate-start prevention and selective Cosmos recovery with ETag-conflict rehearsal.
          All spec regression, observation/abort, backup/recovery, owner and retention decisions must be recorded.
          Do not start a sync or enable starters through this task; execution requires separate scoped approval.

- stage: ProdDeployFunctions
  displayName: 'Approved Prod Flex Code Deployment'
  dependsOn:
    - DevBuild
    - FunctionalTestsDev
    - FunctionsValidationDev
  condition: |
    and(
      succeeded(),
      ${{ eq(parameters.deployFunctionsDev, true) }},
      ${{ eq(parameters.deployFunctionsProd, true) }},
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(dependencies.DevBuild.result, 'Succeeded'),
      in(dependencies.FunctionalTestsDev.result, 'Succeeded'),
      eq(dependencies.FunctionsValidationDev.result, 'Succeeded')
    )
  variables:
    functionArtifactSha256: $[ stageDependencies.DevBuild.BuildFunctionJob.outputs['RecordFunctionArtifact.functionArtifactSha256'] ]

  jobs:
  - job: ApproveProdFunctionsCode
    pool: server
    timeoutInMinutes: 1445
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: '${{ parameters.functionsMigrationApprovers }}'
        approvers: '${{ parameters.functionsMigrationApprovers }}'
        allowApproversToApproveTheirOwnRuns: false
        onTimeout: 'reject'
        instructions: |
          Approve code deployment only to ${{ parameters.functionsProdAppName }}.
          Current run: $(Build.BuildId); exact dev-validated SHA256: $(functionArtifactSha256).
          Require the signed dev evidence and approved prod provisioning, cost, identity, isolation,
          recovery and operational ownership decisions. Reject missing or different-artifact evidence.
          All five starters must already be disabled. No live-data writes, source changes, or cutover
          are authorized here; those require the separate source-drain, canary and observation gates.
  - job: DeployProdFunctionApp
    dependsOn: ApproveProdFunctionsCode
    displayName: 'Deploy Disabled Prod Flex App'
    steps:
    - template: templates/deploy-functions-flex.yml
      parameters:
        appName: '${{ parameters.functionsProdAppName }}'
        sourceAppName: 'gamer-uncle-prod-function'
        resourceGroup: 'gamer-uncle-prod-rg'
        serviceConnection: 'gamer-uncle-prod-sc'
        environment: 'Production'
        approvers: '${{ parameters.functionsMigrationApprovers }}'

