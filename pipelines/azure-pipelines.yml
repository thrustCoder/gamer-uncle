        export FUNCTIONAL_TEST_APP_KEY=$(FUNCTIONAL_TEST_APP_KEY)
        echo "Running functional tests against Dev environment with enhanced retry logic for Azure AI content filtering..."
        
        # Run functional tests with retry logic (1 retry)
        TEST_RESULT=0
