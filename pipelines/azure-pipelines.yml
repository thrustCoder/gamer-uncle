            --resource-group gamer-uncle-prod-rg \
            --query id -o tsv 2>/dev/null || echo "")
          if [ -n "$RULE_ID" ]; then
            az monitor alert-processing-rule update \
              --name gamer-uncle-prod-deploy-suppression \
              --resource-group gamer-uncle-prod-rg \
              --enabled false \
              --output none
            echo "✅ Deployment suppression rule disabled"
          else
            echo "⚠️ Deployment suppression rule not found — nothing to disable"
          fi

# E2E Tests removed due to reliability issues - mobile app loading problems

- stage: ProdDeployAlerts
  displayName: 'Prod Deploy Alerts'
  dependsOn:
    - FunctionalTestsDev
  condition: |
    and(
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      in(dependencies.FunctionalTestsDev.result, 'Succeeded')
    )
  jobs:
  - job: DeployProdAlerts
    displayName: 'Deploy Alert Rules to Prod'
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'Deploy Alert Bicep to Prod'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Deploying alert rules to prod..."
          az deployment group create \
            --resource-group gamer-uncle-prod-rg \
            --template-file infrastructure/alerts/main.bicep \
            --parameters \
              environment=prod \
              appServiceId=$(az webapp show --name gamer-uncle-prod-app-svc --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              appServicePlanId=$(az appservice plan show --name gamer-uncle-prod-app-plan --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              cosmosDbAccountId=$(az cosmosdb show --name gamer-uncle-prod-cosmos --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              functionAppId=$(az functionapp show --name gamer-uncle-prod-function --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              appInsightsId=$(az monitor app-insights component show --app gamer-uncle-prod-app-insights --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              aiServicesAccountId=$(az cognitiveservices account show --name gamer-uncle-prod-foundry-resourc --resource-group gamer-uncle-prod-rg --query id -o tsv) \
              logAnalyticsWorkspaceId=$(az monitor log-analytics workspace show --workspace-name gamer-uncle-prod-log-analytics-ws --resource-group gamer-uncle-prod-rg --query id -o tsv) \
            --name "alerts-deploy-prod-$(Build.BuildId)"
          echo "Prod alert deployment complete."
    - task: AzureCLI@2
      displayName: 'Verify Prod Alerts'
      inputs:
        azureSubscription: 'gamer-uncle-prod-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
                METRIC_COUNT=$(az monitor metrics alert list --resource-group gamer-uncle-prod-rg --query "length([])" -o tsv)
                LOG_COUNT=$(az monitor scheduled-query list --resource-group gamer-uncle-prod-rg --query "length([])" -o tsv)
                echo "Prod alerts: $METRIC_COUNT metric + $LOG_COUNT log = $((METRIC_COUNT + LOG_COUNT)) total"
                if [ "$((METRIC_COUNT + LOG_COUNT))" -lt 20 ]; then
                  echo "WARNING: Expected 24+ alerts, found $((METRIC_COUNT + LOG_COUNT))"
                fi